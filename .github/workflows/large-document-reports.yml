name: Large-document reports

on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 1 * *"

permissions:
  contents: read

jobs:
  report:
    name: ${{ matrix.label }} report
    if: github.repository == 'wyhaines/fused-json.cr'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86-64
            runner: ubuntu-latest
          - label: linux-arm64
            runner: ubuntu-24.04-arm
          - label: macos-arm64
            runner: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1.9.2
        with:
          crystal: latest

      - name: Install dependencies
        run: shards install

      - name: Run portability correctness checks
        run: |
          shards check
          crystal spec --order=random --error-on-warnings
          crystal spec -Dfused_json_force_portable_float -Dfused_json_force_scalar_string_scan --order=random --error-on-warnings

      - name: Build report tools
        run: |
          crystal build --release --no-debug bench/tic_fixture.cr -o "$RUNNER_TEMP/tic-fixture"
          crystal build --release --no-debug bench/tic.cr -o "$RUNNER_TEMP/tic-bench"

      - name: Measure generated 256 MiB input
        env:
          GC_MARKERS: "1"
          GC_NPROCS: "1"
        run: |
          report_dir="$RUNNER_TEMP/fused-json-report"
          input_path="$RUNNER_TEMP/fused-json-tic.json"
          mkdir -p "$report_dir"
          uname -a > "$report_dir/platform.txt"
          crystal version >> "$report_dir/platform.txt"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            FUSED_JSON_BENCH_CPU="$(sysctl -n machdep.cpu.brand_string 2>/dev/null || uname -m)"
            export FUSED_JSON_BENCH_CPU
          fi
          "$RUNNER_TEMP/tic-fixture" --profile many-small --bytes 268435456 --seed 7 --field-order providers-first --output "$input_path" --manifest "$report_dir/manifest.json"
          "$RUNNER_TEMP/tic-bench" verify --input "$input_path" --manifest "$report_dir/manifest.json" > "$report_dir/verify.json"
          "$RUNNER_TEMP/tic-bench" run --input "$input_path" --manifest "$report_dir/manifest.json" --mode fused-typed --commit "$GITHUB_SHA" > "$report_dir/fused-typed.json"
          "$RUNNER_TEMP/tic-bench" run --input "$input_path" --manifest "$report_dir/manifest.json" --mode crystal-typed --commit "$GITHUB_SHA" > "$report_dir/crystal-typed.json"
          ruby -rjson -e 'ARGV.each { |path| JSON.parse(File.read(path)) }' "$report_dir"/*.json

      - name: Retain report receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fused-json-${{ matrix.label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/fused-json-report
          if-no-files-found: warn
          retention-days: 90
